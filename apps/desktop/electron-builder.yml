appId: dev.deskpet.app
productName: DeskPet
executableName: deskpet
copyright: Copyright © 2026 DeskPet

directories:
  output: dist-electron

artifactName: DeskPet-${version}-${os}-${arch}.${ext}

files:
  - dist/**
  - control-center-preload.cjs
  - pet-preload.cjs
  - pet.html
  - assets/**
  - package.json

asar: true
asarUnpack:
  - node_modules/**
npmRebuild: false
publish: null

mac:
  icon: assets/app-icon.icns
  category: public.app-category.utilities
  extendInfo:
    NSMicrophoneUsageDescription: DeskPet 需要使用麦克风进行 AI语音对话。
  target:
    - dmg
    - zip
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: assets/app-icon.ico
  target:
    - nsis

nsis:
  artifactName: DeskPet-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: assets/app-icon.png
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: DeskPet
