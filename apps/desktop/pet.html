<!doctype html>
<html lang="zh-CN" data-reaction-state="idle" data-motion-state="idle" data-chat-open="false" data-voice-active="false">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src petdesk-asset:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'; script-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeskPet</title>
    <style>
      :root {
        --pet-scale: 0.75;
        --pet-width: 144px;
        --pet-height: 156px;
        --pet-bottom: 12px;
        --status-bottom: calc(var(--pet-bottom) + var(--pet-height) + 8px);
        --chat-bottom: calc(var(--pet-bottom) + var(--pet-height) + 10px);
        --bubble-bottom: calc(var(--pet-bottom) + var(--pet-height) + 14px);
        --bubble-with-status-bottom: calc(var(--status-bottom) + 34px);
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-drag: none;
        -webkit-font-smoothing: antialiased;
      }
      html { color: #172033; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        pointer-events: none;
      }
      .stage { position: relative; width: 100%; height: 100%; }
      .pet-hitbox {
        position: absolute;
        left: 50%;
        bottom: var(--pet-bottom);
        width: calc(var(--pet-width) + 40px);
        height: calc(var(--pet-height) + 40px);
        display: grid;
        place-items: center;
        transform: translateX(-50%);
        pointer-events: auto;
        cursor: grab;
      }
      html[data-dragging="true"] .pet-hitbox { cursor: grabbing; }
      .pet-shell {
        width: var(--pet-width);
        height: var(--pet-height);
        position: relative;
        filter: drop-shadow(0 10px 12px rgba(15, 23, 42, 0.22)) drop-shadow(0 2px 3px rgba(15, 23, 42, 0.16));
      }
      .sprite {
        width: 192px;
        height: 208px;
        background-size: 1536px 2288px;
        background-repeat: no-repeat;
        background-position: var(--sprite-offset-x) var(--sprite-row-y);
        --sprite-row-y: 0px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1152px;
        --sprite-frames: 6;
        --sprite-duration: 5500ms;
        --sprite-iterations: infinite;
        --sprite-animation: pet-frames var(--sprite-duration) steps(var(--sprite-frames)) var(--sprite-iterations);
        animation: var(--sprite-animation);
        transform: scale(var(--pet-scale));
        transform-origin: top left;
        image-rendering: auto;
      }
      html[data-reaction-state="idle"] .sprite {
        --sprite-row-y: 0px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1152px;
        --sprite-frames: 6;
        --sprite-duration: 5500ms;
        --sprite-iterations: infinite;
      }
      html[data-reaction-state="waving"] .sprite {
        --sprite-row-y: -624px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -768px;
        --sprite-frames: 4;
        --sprite-duration: 700ms;
        --sprite-iterations: 2;
      }
      html[data-reaction-state="jumping"] .sprite {
        --sprite-row-y: -832px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -960px;
        --sprite-frames: 5;
        --sprite-duration: 840ms;
        --sprite-iterations: 2;
      }
      html[data-reaction-state="failed"] .sprite {
        --sprite-row-y: -1040px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1536px;
        --sprite-frames: 8;
        --sprite-duration: 1220ms;
        --sprite-iterations: 2;
      }
      html[data-reaction-state="waiting"] .sprite {
        --sprite-row-y: -1248px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1152px;
        --sprite-frames: 6;
        --sprite-duration: 1010ms;
        --sprite-iterations: infinite;
      }
      html[data-reaction-state="running"] .sprite {
        --sprite-row-y: -1456px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1152px;
        --sprite-frames: 6;
        --sprite-duration: 820ms;
        --sprite-iterations: infinite;
      }
      html[data-reaction-state="review"] .sprite {
        --sprite-row-y: -1664px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1152px;
        --sprite-frames: 6;
        --sprite-duration: 1030ms;
        --sprite-iterations: infinite;
      }
      html[data-motion-state="right"] .sprite {
        --sprite-row-y: -208px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1536px;
        --sprite-frames: 8;
        --sprite-duration: 1060ms;
        --sprite-iterations: infinite;
      }
      html[data-motion-state="left"] .sprite {
        --sprite-row-y: -416px;
        --sprite-offset-x: 0px;
        --sprite-end-offset-x: -1536px;
        --sprite-frames: 8;
        --sprite-duration: 1060ms;
        --sprite-iterations: infinite;
      }
      @keyframes pet-frames {
        from { background-position: var(--sprite-offset-x) var(--sprite-row-y); }
        to { background-position: var(--sprite-end-offset-x) var(--sprite-row-y); }
      }

      /* ---------- 语音对话状态 ---------- */
      .voice-status {
        display: none;
        position: absolute;
        left: 50%;
        bottom: var(--status-bottom);
        transform: translateX(-50%);
        align-items: center;
        gap: 6px;
        max-width: calc(100vw - 16px);
        padding: 5px 10px 5px 8px;
        box-sizing: border-box;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        background: linear-gradient(135deg, rgba(239, 246, 255, 0.98), rgba(224, 231, 255, 0.96));
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16), 0 2px 5px rgba(15, 23, 42, 0.1);
        color: #1e3a8a;
        font: 650 11px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        animation: status-in 180ms cubic-bezier(0.2, 0, 0, 1);
      }
      html[data-voice-active="true"] .voice-status { display: inline-flex; }
      .voice-status-icon {
        display: inline-flex;
        width: 16px;
        height: 16px;
        color: #2563eb;
        flex: 0 0 16px;
        animation: voice-pulse 1.6s ease-in-out infinite;
      }
      .voice-status-icon svg { width: 16px; height: 16px; }
      .voice-dots { display: inline-flex; align-items: center; gap: 2px; margin-left: 1px; }
      .voice-dots span {
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: #2563eb;
        opacity: 0.45;
        animation: voice-dot 1.1s ease-in-out infinite;
      }
      .voice-dots span:nth-child(2) { animation-delay: 0.18s; }
      .voice-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes voice-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.9); opacity: 0.72; }
      }
      @keyframes voice-dot {
        0%, 100% { opacity: 0.32; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-1px); }
      }
      @keyframes status-in {
        from { opacity: 0; transform: translateX(-50%) translateY(3px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }

      /* ---------- 回答气泡 ---------- */
      .answer-bubble {
        display: none;
        position: absolute;
        left: 50%;
        bottom: var(--bubble-bottom);
        transform: translateX(-50%);
        width: fit-content;
        min-width: 64px;
        max-width: min(300px, calc(100vw - 20px));
        max-height: 148px;
        padding: 10px 12px;
        box-sizing: border-box;
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-radius: 14px 14px 14px 4px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        background: linear-gradient(135deg, rgba(239, 246, 255, 0.98), rgba(237, 233, 254, 0.97));
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.16), 0 2px 5px rgba(15, 23, 42, 0.1);
        color: #172033;
        font: 620 11.5px/16px Inter, ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        text-align: left;
        pointer-events: none;
      }
      html[data-voice-active="true"] .answer-bubble { bottom: var(--bubble-with-status-bottom); }
      .answer-bubble[data-visible="true"] { display: block; animation: bubble-in 180ms cubic-bezier(0.2, 0, 0, 1); }
      .answer-bubble::after {
        content: "";
        position: absolute;
        left: 22px;
        bottom: -6px;
        width: 11px;
        height: 11px;
        background: inherit;
        border-right: 1px solid rgba(255, 255, 255, 0.6);
        border-bottom: 1px solid rgba(255, 255, 255, 0.6);
        border-bottom-right-radius: 3px;
        transform: rotate(45deg);
      }
      @keyframes bubble-in {
        from { opacity: 0; transform: translateX(-50%) translateY(4px) scale(0.98); }
        to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      }

      /* ---------- 文字对话面板 ---------- */
      .chat-panel {
        display: none;
        position: absolute;
        left: 50%;
        bottom: var(--chat-bottom);
        transform: translateX(-50%);
        width: min(340px, calc(100vw - 20px));
        height: 280px;
        box-sizing: border-box;
        flex-direction: column;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(226, 232, 240, 0.92);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.22), 0 3px 8px rgba(15, 23, 42, 0.12);
        pointer-events: auto;
        -webkit-app-region: no-drag;
      }
      html[data-chat-open="true"] .chat-panel { display: flex; animation: panel-in 180ms cubic-bezier(0.2, 0, 0, 1); }
      @keyframes panel-in {
        from { opacity: 0; transform: translateX(-50%) translateY(6px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px 9px 14px;
        border-bottom: 1px solid rgba(226, 232, 240, 0.9);
        background: linear-gradient(135deg, #eff6ff, #eef2ff);
      }
      .chat-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 700 12px/16px Inter, ui-sans-serif, system-ui, sans-serif;
        color: #0f2a52;
      }
      .chat-title-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }
      .chat-status {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font: 600 10.5px/14px Inter, ui-sans-serif, system-ui, sans-serif;
        color: #64748b;
      }
      .chat-close {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        color: #64748b;
        font: 500 16px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .chat-close:hover { background: #ffffff; color: #1e293b; }
      .chat-log {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .chat-log::-webkit-scrollbar { width: 6px; }
      .chat-log::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 999px; }
      .chat-empty {
        margin: auto;
        text-align: center;
        color: #94a3b8;
        font: 600 11.5px/18px Inter, ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .chat-empty-icon { font-size: 22px; line-height: 26px; margin-bottom: 4px; }
      .chat-message { display: flex; }
      .chat-message.is-user { justify-content: flex-end; }
      .chat-message.is-assistant { justify-content: flex-start; }
      .chat-bubble {
        max-width: 82%;
        padding: 7px 10px;
        border-radius: 13px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 560 12px/17px Inter, ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .chat-message.is-user .chat-bubble {
        background: #2563eb;
        color: #ffffff;
        border-bottom-right-radius: 5px;
      }
      .chat-message.is-assistant .chat-bubble {
        background: #f1f5f9;
        color: #172033;
        border-bottom-left-radius: 5px;
      }
      .chat-compose {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px 10px;
        border-top: 1px solid rgba(226, 232, 240, 0.9);
        background: rgba(248, 250, 252, 0.9);
      }
      .chat-input {
        flex: 1;
        min-width: 0;
        height: 32px;
        padding: 0 10px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #ffffff;
        color: #172033;
        font: 500 12px/32px Inter, ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        outline: none;
        user-select: text;
        -webkit-app-region: no-drag;
      }
      .chat-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14); }
      .chat-input::placeholder { color: #94a3b8; }
      .chat-send {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
      }
      .chat-send:hover { background: #1d4ed8; }
      .chat-send:disabled { background: #cbd5e1; cursor: default; }
      .chat-send svg { width: 15px; height: 15px; }

      @media (prefers-reduced-motion: reduce) {
        html[data-reaction-state="idle"] .sprite { animation: none; }
        .voice-status-icon, .voice-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <section class="chat-panel" data-role="chat-panel" aria-label="与 AI 语音对话">
        <header class="chat-head">
          <span class="chat-title"><span class="chat-title-dot"></span>AI语音对话</span>
          <span class="chat-status" data-role="chat-status"></span>
          <button class="chat-close" type="button" data-role="chat-close" aria-label="关闭对话">×</button>
        </header>
        <div class="chat-log" data-role="chat-log">
          <div class="chat-empty" data-role="chat-empty">
            <div class="chat-empty-icon" aria-hidden="true">🐾</div>
            点击宠物说话，或长按 Alt 进行语音对话
          </div>
        </div>
        <form class="chat-compose" data-role="chat-form">
          <input class="chat-input" data-role="chat-input" type="text" maxlength="500" placeholder="和 AI 说点什么…" autocomplete="off" />
          <button class="chat-send" type="submit" data-role="chat-send" aria-label="发送" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4Z" />
            </svg>
          </button>
        </form>
      </section>
      <div class="voice-status" data-role="voice-status" aria-live="polite">
        <span class="voice-status-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H7l-4 3v-6.5A8.5 8.5 0 0 1 11.5 3h1A8.5 8.5 0 0 1 21 11.5Z" />
          </svg>
        </span>
        <span data-role="voice-status-label">对话中</span>
        <span class="voice-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </div>
      <div class="answer-bubble" data-role="answer-bubble" data-visible="false" aria-live="polite"></div>
      <div class="pet-hitbox" role="img" aria-label="DeskPet">
        <div class="pet-shell">
          <div class="sprite"></div>
        </div>
      </div>
    </div>
  </body>
</html>
